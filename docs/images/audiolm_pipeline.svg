<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" font-family="'Inter', 'Source Sans 3', system-ui, sans-serif">
  <defs>
    <linearGradient id="stage1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.04"/>
    </linearGradient>
    <linearGradient id="stage2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.04"/>
    </linearGradient>
    <linearGradient id="stage3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.04"/>
    </linearGradient>
    <marker id="arrowBlue2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d97706"/>
    </marker>
    <marker id="arrowGreen2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="340" rx="12" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="38" font-size="16" font-weight="700" fill="#1e293b">AudioLM / MusicLM 3-Stage Hierarchical Language Modeling Pipeline</text>

  <!-- STAGE 1: SEMANTIC LM -->
  <g transform="translate(30, 60)">
    <rect width="880" height="75" rx="8" fill="url(#stage1Grad)" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#1e40af">Stage 1: Semantic LM</text>
    
    <g transform="translate(20, 34)" font-size="11">
      <!-- Input -->
      <rect x="0" y="0" width="130" height="28" rx="5" fill="#eff6ff" stroke="#60a5fa" stroke-width="1"/>
      <text x="65" y="18" text-anchor="middle" font-weight="600" fill="#1d4ed8">Prompt Tokens</text>

      <line x1="135" y1="14" x2="175" y2="14" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue2)"/>

      <!-- Model -->
      <rect x="180" y="0" width="200" height="28" rx="5" fill="#2563eb"/>
      <text x="280" y="18" text-anchor="middle" font-weight="700" fill="#ffffff">Semantic LM (AR Transformer)</text>

      <line x1="385" y1="14" x2="425" y2="14" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue2)"/>

      <!-- Output -->
      <rect x="430" y="0" width="250" height="28" rx="5" fill="#eff6ff" stroke="#60a5fa" stroke-width="1"/>
      <text x="555" y="18" text-anchor="middle" font-weight="600" fill="#1d4ed8">Semantic Tokens (w2v-BERT / HuBERT)</text>
    </g>
  </g>

  <!-- STAGE 2: COARSE ACOUSTIC LM -->
  <g transform="translate(30, 148)">
    <rect width="880" height="75" rx="8" fill="url(#stage2Grad)" stroke="#fde68a" stroke-width="1.5"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#92400e">Stage 2: Coarse Acoustic LM</text>
    
    <g transform="translate(20, 34)" font-size="11">
      <!-- Input -->
      <rect x="0" y="0" width="130" height="28" rx="5" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
      <text x="65" y="18" text-anchor="middle" font-weight="600" fill="#b45309">Semantic Tokens</text>

      <line x1="135" y1="14" x2="175" y2="14" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

      <!-- Model -->
      <rect x="180" y="0" width="230" height="28" rx="5" fill="#d97706"/>
      <text x="295" y="18" text-anchor="middle" font-weight="700" fill="#ffffff">Coarse Acoustic LM (AR Transformer)</text>

      <line x1="415" y1="14" x2="455" y2="14" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

      <!-- Output -->
      <rect x="460" y="0" width="250" height="28" rx="5" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
      <text x="585" y="18" text-anchor="middle" font-weight="600" fill="#b45309">Coarse Codec Tokens (RVQ CB 1..2)</text>
    </g>
  </g>

  <!-- STAGE 3: FINE ACOUSTIC LM -->
  <g transform="translate(30, 236)">
    <rect width="880" height="75" rx="8" fill="url(#stage3Grad)" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#065f46">Stage 3: Fine Acoustic LM</text>
    
    <g transform="translate(20, 34)" font-size="11">
      <!-- Input -->
      <rect x="0" y="0" width="150" height="28" rx="5" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/>
      <text x="75" y="18" text-anchor="middle" font-weight="600" fill="#047857">Coarse Acoustic Tokens</text>

      <line x1="155" y1="14" x2="195" y2="14" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen2)"/>

      <!-- Model -->
      <rect x="200" y="0" width="240" height="28" rx="5" fill="#059669"/>
      <text x="320" y="18" text-anchor="middle" font-weight="700" fill="#ffffff">Fine Acoustic LM (Non-Causal LM)</text>

      <line x1="445" y1="14" x2="485" y2="14" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen2)"/>

      <!-- Output -->
      <rect x="490" y="0" width="250" height="28" rx="5" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/>
      <text x="615" y="18" text-anchor="middle" font-weight="600" fill="#047857">Fine Codec Tokens (RVQ CB 3..8)</text>
    </g>
  </g>
</svg>
