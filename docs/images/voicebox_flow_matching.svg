<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" font-family="'Inter', 'Source Sans 3', system-ui, sans-serif">
  <defs>
    <linearGradient id="noiseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="tfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="audioGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.08"/>
    </linearGradient>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6366f1"/>
    </marker>
    <marker id="arrowPink" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#db2777"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="340" rx="12" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="30" y="38" font-size="16" font-weight="700" fill="#1e293b">Voicebox Optimal Transport Flow Matching</text>
  <text x="30" y="58" font-size="12" fill="#64748b">Learns a vector field v_θ(z_t, t) driving prior Gaussian noise z₀ directly to target continuous audio latent distribution z₁.</text>

  <!-- Prior Noise z0 -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="130" height="130" rx="10" fill="url(#noiseGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="65" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">Prior Noise z₀</text>
    <text x="65" y="55" text-anchor="middle" font-size="11" fill="#64748b">z₀ ~ 𝒩(0, I)</text>

    <!-- Random dots representing Gaussian noise -->
    <circle cx="30" cy="80" r="3" fill="#94a3b8"/>
    <circle cx="55" cy="105" r="4" fill="#64748b"/>
    <circle cx="85" cy="85" r="2.5" fill="#475569"/>
    <circle cx="100" cy="110" r="3.5" fill="#94a3b8"/>
    <circle cx="45" cy="115" r="2" fill="#64748b"/>
  </g>

  <!-- Arrow Noise -> Flow Trajectory -->
  <line x1="172" y1="165" x2="238" y2="165" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Vector Field / Flow Trajectory Box -->
  <g transform="translate(240, 85)">
    <rect x="0" y="0" width="460" height="160" rx="12" fill="url(#tfGrad)" stroke="#6366f1" stroke-width="1.8"/>
    <text x="230" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">Vector Field v_θ(z_t, t, x_cond)</text>
    <text x="230" y="50" text-anchor="middle" font-size="11" fill="#4f46e5">Parameterized by Transformer Backbone</text>

    <!-- Trajectory Curves -->
    <path d="M 40,110 Q 150,70 230,100 T 420,90" fill="none" stroke="#818cf8" stroke-width="2.5"/>
    <path d="M 40,130 Q 150,90 230,120 T 420,110" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Flow Vector Arrows along the trajectory -->
    <line x1="130" y1="92" x2="165" y2="85" stroke="#4338ca" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <line x1="280" y1="108" x2="315" y2="102" stroke="#4338ca" stroke-width="2" marker-end="url(#arrowPurple)"/>

    <text x="148" y="78" font-size="10" font-weight="700" fill="#3730a3">v_θ(z_t, t)</text>
    <text x="230" y="145" text-anchor="middle" font-size="11" font-weight="600" fill="#312e81">Straight Linear Path: x_t = (1-t)x₀ + t x₁</text>
  </g>

  <!-- Arrow Flow Trajectory -> Target Latent z1 -->
  <line x1="702" y1="165" x2="768" y2="165" stroke="#db2777" stroke-width="2" marker-end="url(#arrowPink)"/>

  <!-- Target Audio Latent z1 -->
  <g transform="translate(770, 100)">
    <rect x="0" y="0" width="130" height="130" rx="10" fill="url(#audioGrad)" stroke="#db2777" stroke-width="1.5"/>
    <text x="65" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#9d174d">Audio Latent z₁</text>
    <text x="65" y="55" text-anchor="middle" font-size="11" fill="#be185d">Target Distribution</text>

    <!-- Waveform Representation inside z1 -->
    <path d="M 15 95 Q 30 75 45 95 T 75 95 T 105 95 T 115 95" fill="none" stroke="#db2777" stroke-width="2"/>
  </g>

  <!-- Legend -->
  <rect x="30" y="275" width="880" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="470" y="300" text-anchor="middle" font-size="11" fill="#475569">
    <tspan font-weight="700" fill="#1e293b">Infilling Advantage:</tspan> Voicebox uses non-causal attention to infill missing audio spans in ~10-25 ODE solver steps, ~20x faster than AR models.
  </text>
</svg>
