<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="specGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12"/>
  <rect width="898" height="378" x="1" y="1" fill="none" stroke="#e2e8f0" stroke-width="2" rx="11"/>

  <text x="450" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Audio Mel-Spectrogram Extraction &amp; Patch Embedding Pipeline</text>

  <!-- Step 1: 1D Waveform -->
  <g transform="translate(30, 70)">
    <rect width="200" height="230" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
    <text x="100" y="28" font-family="sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">1. Continuous Waveform</text>
    <path d="M 20 130 Q 30 70 40 130 T 60 130 T 80 180 T 100 80 T 120 170 T 140 100 T 160 150 T 180 130" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <text x="100" y="205" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">1D Audio Signal x(n)</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(240, 165)">
    <path d="M 0 20 L 40 20" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="40,15 50,20 40,25" fill="#64748b"/>
    <text x="25" y="10" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">STFT / Mel</text>
  </g>

  <!-- Step 2: 2D Mel Spectrogram -->
  <g transform="translate(300, 70)">
    <rect width="240" height="230" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
    <text x="120" y="28" font-family="sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">2. Mel-Spectrogram (F x T)</text>
    <rect x="25" y="45" width="190" height="150" fill="url(#specGrad)" rx="4"/>
    
    <!-- Grid overlay showing 16x16 patches -->
    <path d="M 25 82.5 L 215 82.5 M 25 120 L 215 120 M 25 157.5 L 215 157.5" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,2"/>
    <path d="M 72.5 45 L 72.5 195 M 120 45 L 120 195 M 167.5 45 L 167.5 195" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,2"/>
    
    <!-- Highlighted patch -->
    <rect x="72.5" y="82.5" width="47.5" height="37.5" fill="none" stroke="#facc15" stroke-width="3"/>
    
    <text x="120" y="215" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Divided into P_F x P_T Patches</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(550, 165)">
    <path d="M 0 20 L 40 20" stroke="#64748b" stroke-width="2"/>
    <polygon points="40,15 50,20 40,25" fill="#64748b"/>
    <text x="25" y="10" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Conv2d</text>
  </g>

  <!-- Step 3: Patch Embeddings -->
  <g transform="translate(610, 70)">
    <rect width="250" height="230" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
    <text x="125" y="28" font-family="sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">3. Linear Projection</text>
    
    <rect x="30" y="55" width="190" height="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="4"/>
    <text x="125" y="75" font-family="sans-serif" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">Patch 1 Embedding (D-dim)</text>
    
    <rect x="30" y="95" width="190" height="30" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" rx="4"/>
    <text x="125" y="115" font-family="sans-serif" font-size="12" font-weight="600" fill="#5b21b6" text-anchor="middle">Patch 2 Embedding (D-dim)</text>
    
    <circle cx="125" cy="140" r="3" fill="#94a3b8"/>
    <circle cx="125" cy="150" r="3" fill="#94a3b8"/>
    <circle cx="125" cy="160" r="3" fill="#94a3b8"/>

    <rect x="30" y="175" width="190" height="30" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5" rx="4"/>
    <text x="125" y="195" font-family="sans-serif" font-size="12" font-weight="600" fill="#9d174d" text-anchor="middle">Patch N Embedding (D-dim)</text>
  </g>

  <text x="450" y="340" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Figure 1 — Audio Spectrogram Transformer (AST) tokenization pipeline: 1D Waveform → STFT Spectrogram → 2D Patches → 1D Vector Projections</text>
</svg>
