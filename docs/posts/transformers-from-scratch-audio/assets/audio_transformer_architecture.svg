<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12"/>
  <rect width="898" height="438" x="1" y="1" fill="none" stroke="#e2e8f0" stroke-width="2" rx="11"/>

  <text x="450" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Audio Transformer (AST) Architecture Overview</text>

  <!-- Input Spectrogram Patches -->
  <g transform="translate(40, 70)">
    <rect width="820" height="60" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
    <text x="70" y="35" font-family="sans-serif" font-size="12" font-weight="700" fill="#0284c7" text-anchor="middle">[CLS] Token</text>
    <rect x="25" y="12" width="90" height="35" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" rx="4"/>
    
    <rect x="145" y="12" width="110" height="35" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" rx="4"/>
    <text x="200" y="35" font-family="sans-serif" font-size="12" font-weight="600" fill="#7e22ce" text-anchor="middle">Patch 1 Embed</text>

    <rect x="275" y="12" width="110" height="35" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" rx="4"/>
    <text x="330" y="35" font-family="sans-serif" font-size="12" font-weight="600" fill="#7e22ce" text-anchor="middle">Patch 2 Embed</text>

    <text x="430" y="35" font-family="sans-serif" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle">• • •</text>

    <rect x="475" y="12" width="110" height="35" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" rx="4"/>
    <text x="530" y="35" font-family="sans-serif" font-size="12" font-weight="600" fill="#7e22ce" text-anchor="middle">Patch N Embed</text>

    <rect x="625" y="12" width="170" height="35" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
    <text x="710" y="35" font-family="sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">+ Positional Encoding</text>
  </g>

  <!-- Arrow down -->
  <path d="M 450 135 L 450 160" stroke="#64748b" stroke-width="2"/>
  <polygon points="445,160 450,170 455,160" fill="#64748b"/>

  <!-- Transformer Encoder Stack -->
  <g transform="translate(200, 175)">
    <rect width="500" height="150" fill="#ffffff" stroke="#3b82f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="250" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">Transformer Encoder Stack (L = 12 Layers)</text>
    
    <rect x="30" y="45" width="440" height="40" fill="#eff6ff" stroke="#60a5fa" stroke-width="1" rx="6"/>
    <text x="250" y="70" font-family="sans-serif" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">Multi-Head Self-Attention (MHSA)</text>
    
    <rect x="30" y="95" width="440" height="40" fill="#f5f3ff" stroke="#c084fc" stroke-width="1" rx="6"/>
    <text x="250" y="120" font-family="sans-serif" font-size="13" font-weight="600" fill="#6b21a8" text-anchor="middle">Feed-Forward MLP Network (GELU)</text>
  </g>

  <!-- Arrow down from CLS -->
  <path d="M 270 330 L 270 360" stroke="#0284c7" stroke-width="2.5"/>
  <polygon points="265,360 270,370 275,360" fill="#0284c7"/>

  <!-- MLP Classification Head -->
  <g transform="translate(180, 370)">
    <rect width="180" height="35" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" rx="6"/>
    <text x="90" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">Extract [CLS] Token</text>
  </g>

  <!-- Arrow right -->
  <path d="M 365 387 L 415 387" stroke="#0284c7" stroke-width="2"/>
  <polygon points="415,382 425,387 415,392" fill="#0284c7"/>

  <!-- Final Classification Output -->
  <g transform="translate(430, 370)">
    <rect width="270" height="35" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" rx="6"/>
    <text x="135" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">MLP Classifier (Softmax Output)</text>
  </g>

  <text x="450" y="425" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Figure 2 — Complete end-to-end Audio Transformer dataflow from tokenized input to classification output</text>
</svg>
