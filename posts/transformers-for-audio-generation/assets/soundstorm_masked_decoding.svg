<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" font-family="'Inter', 'Source Sans 3', system-ui, sans-serif">
  <defs>
    <linearGradient id="unmaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:0.1"/>
    </linearGradient>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="360" rx="12" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="30" y="38" font-size="16" font-weight="700" fill="#1e293b">SoundStorm Iterative Parallel Masked Decoding</text>
  <text x="30" y="58" font-size="12" fill="#64748b">Iteratively unmasks acoustic tokens in parallel using confidence scores across RVQ levels, reducing steps by ~100x.</text>

  <!-- STEP 0: FULLY MASKED -->
  <g transform="translate(30, 95)">
    <text x="120" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">Step 0: Initial Fully Masked Matrix</text>
    
    <!-- Codebook Level Labels -->
    <text x="0" y="30" font-size="11" font-weight="600" fill="#64748b">Coarse CB 1</text>
    <text x="0" y="65" font-size="11" font-weight="600" fill="#64748b">Coarse CB 2</text>
    <text x="0" y="100" font-size="11" font-weight="600" fill="#64748b">Fine CB 3</text>
    <text x="0" y="135" font-size="11" font-weight="600" fill="#64748b">Fine CB 4</text>

    <!-- Token Boxes -->
    <g transform="translate(85, 12)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="38" y="0" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="76" y="0" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="114" y="0" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      
      <!-- Row 2 -->
      <rect x="0" y="35" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="38" y="35" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="76" y="35" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="114" y="35" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>

      <!-- Row 3 -->
      <rect x="0" y="70" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="38" y="70" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="76" y="70" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="114" y="70" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>

      <!-- Row 4 -->
      <rect x="0" y="105" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="38" y="105" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="76" y="105" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="114" y="105" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
    </g>

    <text x="160" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">100% Masked</text>
  </g>

  <!-- Arrow Step 0 -> Step 1 -->
  <line x1="285" y1="180" x2="335" y2="180" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="310" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">Pass 1</text>

  <!-- STEP 1: UNMASK HIGH CONFIDENCE COARSE -->
  <g transform="translate(350, 95)">
    <text x="120" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Step 1: Unmask Coarse Tokens</text>
    
    <g transform="translate(45, 12)">
      <!-- Row 1 (Unmasked high confidence) -->
      <rect x="0" y="0" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <text x="16" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">k₁</text>

      <rect x="38" y="0" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>

      <rect x="76" y="0" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <text x="92" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">k₃</text>

      <rect x="114" y="0" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <text x="130" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">k₄</text>

      <!-- Row 2 -->
      <rect x="0" y="35" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <text x="16" y="52" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">k₁</text>

      <rect x="38" y="35" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="76" y="35" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="114" y="35" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>

      <!-- Row 3 (Fully Masked) -->
      <rect x="0" y="70" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="38" y="70" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="76" y="70" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="114" y="70" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>

      <!-- Row 4 -->
      <rect x="0" y="105" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="38" y="105" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="76" y="105" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="114" y="105" width="32" height="26" rx="4" fill="url(#maskGrad)" stroke="#94a3b8" stroke-width="1"/>
    </g>

    <text x="120" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">Confidence-based Unmasking</text>
  </g>

  <!-- Arrow Step 1 -> Step K -->
  <line x1="605" y1="180" x2="655" y2="180" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="630" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">Step K (~16)</text>

  <!-- STEP K: FULLY UNMASKED MATRIX -->
  <g transform="translate(670, 95)">
    <text x="120" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Step K: Fully Unmasked Matrix</text>
    
    <g transform="translate(45, 12)">
      <!-- All rows unmasked -->
      <rect x="0" y="0" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="38" y="0" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="76" y="0" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="114" y="0" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>

      <rect x="0" y="35" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="38" y="35" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="76" y="35" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="114" y="35" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>

      <rect x="0" y="70" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="38" y="70" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="76" y="70" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="114" y="70" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>

      <rect x="0" y="105" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="38" y="105" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="76" y="105" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="114" y="105" width="32" height="26" rx="4" fill="url(#unmaskGrad)" stroke="#10b981" stroke-width="1.5"/>
    </g>

    <text x="120" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">100% Unmasked Audio Codecs</text>
  </g>

  <!-- Legend -->
  <rect x="30" y="300" width="880" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="470" y="322" text-anchor="middle" font-size="11" fill="#475569">
    <tspan font-weight="700" fill="#1e293b">Speed Advantage:</tspan> SoundStorm generates entire time sequences in parallel per RVQ layer, resolving 30s of audio in ~35 passes vs 1,500+ AR passes.
  </text>
</svg>
