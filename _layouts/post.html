---
layout: default
---
<style>
  .post-container {
    display: flex;
    flex-direction: column;
    gap: 2rem;
    max-width: 82rem;
    margin: 0 auto;
    padding: 0 1rem;
  }
  @media (min-width: 1024px) {
    .post-container {
      flex-direction: row;
      align-items: flex-start;
    }
    .post-main {
      flex: 1 1 0%;
      min-width: 0;
    }
    .post-sidebar {
      display: block !important;
      width: 20.5rem;
      flex-shrink: 0;
      position: sticky;
      top: 1.5rem;
      max-height: calc(100vh - 3rem);
      overflow-y: auto;
    }
  }

  .toc-card {
    background-color: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 0.875rem;
    padding: 1.125rem;
    box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
  }

  .toc-link {
    transition: all 0.15s ease-in-out;
    border-left: 2.5px solid transparent;
  }
  .toc-link:hover {
    background-color: #f1f5f9;
    color: #0f172a;
    border-left-color: #94a3b8;
  }
  .toc-link.active-toc {
    background-color: #f1f5f9;
    color: #0f172a;
    font-weight: 600;
    border-left-color: #2563eb;
  }

  .toc-arrow {
    display: inline-block;
    transition: transform 0.2s ease-in-out;
  }
</style>

<article class="py-6 md:py-10 bg-surface">
  <div class="post-container">
    <!-- Main Content Column -->
    <div class="post-main">
      <header class="mb-8">
        <h1 class="font-display text-3xl md:text-4xl font-semibold text-text">
          {{ page.title }}
        </h1>
        <p class="text-text-muted mt-2 text-sm">
          {{ page.date | date: "%B %d, %Y" }}
          {% if page.tags.size > 0 %}
          <span class="mx-2">·</span>
          {% for tag in page.tags %}
            <span class="inline-block bg-surface-muted text-text-body text-xs px-2 py-0.5 rounded mr-1">{{ tag }}</span>
          {% endfor %}
          {% endif %}
        </p>
      </header>

      <div class="prose prose-lg max-w-none id-content">
        {{ content }}
      </div>

      <footer class="mt-12 pt-8 border-t border-border">
        <a href="{{ '/blog.html' | relative_url }}" class="inline-flex items-center text-link hover:text-link-hover transition-colors no-underline">
          ← Back to blog
        </a>
      </footer>
    </div>

    <!-- Right Sidebar Table of Contents -->
    <aside class="hidden post-sidebar">
      <div class="toc-card">
        <h3 class="text-sm font-sans font-bold uppercase tracking-wider text-text-body mb-3 flex items-center gap-2 border-b border-border-subtle pb-2.5">
          <svg class="w-4 h-4 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
          </svg>
          Table of Contents
        </h3>
        <nav id="sticky-toc" class="text-sm space-y-1">
          <!-- Dynamically populated via JS -->
        </nav>
      </div>
    </aside>
  </div>
</article>

<!-- Floating Mobile Sticky Navigation Button & Menu -->
<div class="lg:hidden fixed top-16 right-4 z-40">
  <button id="toc-toggle-btn" class="bg-surface/95 backdrop-blur border border-border text-text px-3 py-1.5 rounded-full shadow-md text-xs font-sans font-medium flex items-center gap-1.5 hover:bg-surface-alt transition-colors">
    <svg class="w-3.5 h-3.5 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
    </svg>
    <span>Contents</span>
  </button>

  <!-- Mobile Drawer -->
  <div id="toc-mobile-menu" class="hidden absolute right-0 mt-2 w-72 max-h-[70vh] overflow-y-auto bg-surface border border-border rounded-xl shadow-xl p-4 z-50 text-xs">
    <div class="flex items-center justify-between pb-2 mb-2 border-b border-border-subtle">
      <span class="font-bold text-text text-xs uppercase tracking-wider">Navigation</span>
      <button id="toc-close-btn" class="text-text-muted hover:text-text text-base leading-none">&times;</button>
    </div>
    <nav id="sticky-toc-mobile" class="space-y-1 text-text-muted">
      <!-- Dynamically populated via JS -->
    </nav>
  </div>
</div>

<script>
  (function initTOC() {
    function buildTOC() {
      const headings = Array.from(document.querySelectorAll('.id-content h2, .id-content h3, .id-content h4'));
      const desktopToc = document.getElementById('sticky-toc');
      const mobileToc = document.getElementById('sticky-toc-mobile');
      
      if (!headings.length || !desktopToc) return;

      // Group headings into main sections (H2)
      let sections = [];
      let currentSection = null;

      headings.forEach((heading, idx) => {
        const text = heading.textContent.trim();
        if (text.toLowerCase().includes('table of contents')) return;

        if (!heading.id) {
          heading.id = 'heading-' + idx;
        }

        const tag = heading.tagName.toLowerCase();
        const cleanTitle = text.replace(/^#+\s*/, '');

        if (tag === 'h2') {
          currentSection = {
            h2: { id: heading.id, title: cleanTitle },
            subs: []
          };
          sections.push(currentSection);
        } else if (currentSection) {
          currentSection.subs.push({
            id: heading.id,
            title: cleanTitle,
            level: tag
          });
        }
      });

      function renderNavHTML() {
        return sections.map((sec) => {
          const subsHTML = sec.subs.map(sub => {
            const indentClass = sub.level === 'h3' ? 'pl-3 text-xs font-normal text-text-muted' : 'pl-5 text-[12px] font-normal text-text-subtle';
            return `<a href="#${sub.id}" class="toc-link block py-1 px-3 rounded-r transition-colors ${indentClass}" data-target="${sub.id}">${sub.title}</a>`;
          }).join('');

          return `
            <div class="toc-group mb-1.5" data-section="${sec.h2.id}">
              <a href="#${sec.h2.id}" class="toc-link toc-h2 block py-1.5 px-3 rounded-r font-semibold text-text-body text-sm hover:bg-slate-100 transition-colors flex items-center justify-between" data-target="${sec.h2.id}">
                <span>${sec.h2.title}</span>
                ${sec.subs.length ? '<span class="toc-arrow text-xs text-text-subtle transition-transform ml-1">▸</span>' : ''}
              </a>
              ${sec.subs.length ? `<div class="toc-sub-container hidden border-l-2 border-slate-200 ml-3.5 pl-2 mt-1 space-y-1">${subsHTML}</div>` : ''}
            </div>
          `;
        }).join('');
      }

      const html = renderNavHTML();
      desktopToc.innerHTML = html;
      if (mobileToc) mobileToc.innerHTML = html;

      // Toggle Mobile Menu
      const toggleBtn = document.getElementById('toc-toggle-btn');
      const closeBtn = document.getElementById('toc-close-btn');
      const mobileMenu = document.getElementById('toc-mobile-menu');

      if (toggleBtn && mobileMenu) {
        toggleBtn.onclick = function(e) {
          e.stopPropagation();
          mobileMenu.classList.toggle('hidden');
        };
        if (closeBtn) {
          closeBtn.onclick = function() { mobileMenu.classList.add('hidden'); };
        }
        document.addEventListener('click', function(e) {
          if (!mobileMenu.contains(e.target) && !toggleBtn.contains(e.target)) {
            mobileMenu.classList.add('hidden');
          }
        });
      }

      // ScrollSpy & Collapsible Accordion Logic
      const allGroups = document.querySelectorAll('.toc-group');
      const allLinks = document.querySelectorAll('.toc-link');

      function onScroll() {
        let activeHeadingId = '';
        let activeH2Id = '';

        headings.forEach(heading => {
          const top = heading.getBoundingClientRect().top;
          if (top <= 140) {
            activeHeadingId = heading.id;
          }
        });

        if (!activeHeadingId && sections.length) {
          activeHeadingId = sections[0].h2.id;
        }

        // Find which section (h2) contains activeHeadingId
        sections.forEach(sec => {
          if (sec.h2.id === activeHeadingId || sec.subs.some(sub => sub.id === activeHeadingId)) {
            activeH2Id = sec.h2.id;
          }
        });

        // Expand active section, collapse all others
        allGroups.forEach(group => {
          const secId = group.getAttribute('data-section');
          const subContainer = group.querySelector('.toc-sub-container');
          const arrow = group.querySelector('.toc-arrow');

          if (secId === activeH2Id) {
            if (subContainer) subContainer.classList.remove('hidden');
            if (arrow) arrow.style.transform = 'rotate(90deg)';
          } else {
            if (subContainer) subContainer.classList.add('hidden');
            if (arrow) arrow.style.transform = 'rotate(0deg)';
          }
        });

        // Highlight active link
        allLinks.forEach(link => {
          if (link.getAttribute('data-target') === activeHeadingId) {
            link.classList.add('active-toc');
          } else {
            link.classList.remove('active-toc');
          }
        });
      }

      window.addEventListener('scroll', onScroll);
      onScroll();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', buildTOC);
    } else {
      buildTOC();
    }
  })();
</script>
